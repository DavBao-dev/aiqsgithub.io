<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài viết</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<header class="site"><h1 id="siteTitle"><a href="index.html">My Blog</a></h1></header>

<div class="layout-wrap">
  <aside class="sidebar">
    <h2>Mục lục</h2>
    <div id="sidebarList" class="state">Đang tải...</div>
  </aside>
  <main>
    <a class="back-link" href="index.html">&larr; Tất cả bài viết</a>
    <div id="content" class="state">Đang tải bài viết...</div>
  </main>
</div>

<script>
const cfg = window.BLOG_CONFIG;
document.getElementById('siteTitle').innerHTML = `<a href="index.html">${cfg.siteTitle}</a>`;

// Chuẩn hoá Unicode về dạng dựng sẵn (NFC) để tránh lỗi tách dấu (vd "viê´t" thay vì "viết")
function norm(s) { return s ? s.normalize('NFC') : s; }

function parseFrontmatter(raw) {
  const m = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: raw };
  const meta = {};
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > -1) meta[line.slice(0, idx).trim()] = norm(line.slice(idx + 1).trim().replace(/^["']|["']$/g, ''));
  });
  return { meta, body: norm(m[2]) };
}

function guessTitleAndDate(filename, meta, body) {
  const dm = filename.match(/^(\d{4}-\d{2}-\d{2})-(.+)\.md$/);
  const date = meta.date || (dm ? dm[1] : '');
  let title = meta.title;
  if (!title) {
    const h = body.match(/^#\s+(.+)$/m);
    title = h ? h[1] : (dm ? dm[2].replace(/-/g, ' ') : filename.replace(/\.md$/, ''));
  }
  return { title, date };
}

const activeFile = new URLSearchParams(location.search).get('file') || '';

async function loadSidebar() {
  const sidebarEl = document.getElementById('sidebarList');
  const owner = (cfg.owner || '').trim();
  const repo = (cfg.repo || '').trim();
  const branch = (cfg.branch || '').trim();
  const postsPath = (cfg.postsPath || '').trim();
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${postsPath}?ref=${branch}`;
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status} tại ${apiUrl}`);
    const files = (await res.json()).filter(f => f.name.endsWith('.md'));
    files.sort((a, b) => b.name.localeCompare(a.name));

    const items = await Promise.all(files.map(async f => {
      const raw = norm(await (await fetch(f.download_url)).text());
      const { meta, body } = parseFrontmatter(raw);
      const { title, date } = guessTitleAndDate(f.name, meta, body);
      return { title, date, path: f.path };
    }));

    sidebarEl.className = '';
    sidebarEl.innerHTML = `<ul>${items.map(p => `
      <li>
        <a href="post.html?file=${encodeURIComponent(p.path)}" class="${p.path === activeFile ? 'active' : ''}">${p.title}<span class="date">${p.date}</span></a>
      </li>
    `).join('')}</ul>`;
  } catch (e) {
    sidebarEl.textContent = 'Lỗi tải mục lục.';
  }
}

async function loadPost() {
  const el = document.getElementById('content');
  const file = activeFile;
  if (!file) { el.textContent = 'Thiếu tham số ?file='; return; }
  try {
    const owner = (cfg.owner || '').trim();
    const repo = (cfg.repo || '').trim();
    const branch = (cfg.branch || '').trim();
    const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${file}`;
    const res = await fetch(rawUrl);
    if (!res.ok) throw new Error(`Không tải được file (HTTP ${res.status}) tại ${rawUrl}`);
    const raw = norm(await res.text());
    const { meta, body } = parseFrontmatter(raw);
    const dm = file.match(/(\d{4}-\d{2}-\d{2})/);
    const date = meta.date || (dm ? dm[1] : '');
    const titleMatch = body.match(/^#\s+(.+)$/m);
    const title = meta.title || (titleMatch ? titleMatch[1] : file);
    document.title = `${title} · ${cfg.siteTitle}`;

    el.className = '';
    el.innerHTML = `
      <div class="post-header">
        <div class="date">${date}</div>
        <h1>${title}</h1>
      </div>
      <article class="content">${marked.parse(body)}</article>
    `;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  } catch (e) {
    el.textContent = 'Lỗi tải bài viết: ' + e.message;
  }
}
loadPost();
loadSidebar();
</script>
</body>
</html>
