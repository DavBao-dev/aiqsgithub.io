<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog</title>
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
</head>
<body>
<header class="site"><h1 id="siteTitle"><a href="index.html">My Blog</a></h1></header>

<div class="layout-wrap">
  <aside class="sidebar">
    <h2>Mục lục</h2>
    <div id="sidebarList" class="state">Đang tải...</div>
  </aside>
  <main>
    <div id="list" class="state">Đang tải danh sách bài viết...</div>
  </main>
</div>

<script>
const cfg = window.BLOG_CONFIG;
document.getElementById('siteTitle').innerHTML = `<a href="index.html">${cfg.siteTitle}</a>`;
document.title = cfg.siteTitle;

// Chuẩn hoá Unicode về dạng dựng sẵn (NFC) để tránh lỗi tách dấu (vd "viê´t" thay vì "viết")
function norm(s) { return s ? s.normalize('NFC') : s; }

function parseFrontmatter(raw) {
  const m = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: raw };
  const meta = {};
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > -1) meta[line.slice(0, idx).trim()] = norm(line.slice(idx + 1).trim().replace(/^["']|["']$/g, ''));
  });
  return { meta, body: norm(m[2]) };
}

function guessTitleAndDate(filename, meta, body) {
  const dm = filename.match(/^(\d{4}-\d{2}-\d{2})-(.+)\.md$/);
  const date = meta.date || (dm ? dm[1] : '');
  let title = meta.title;
  if (!title) {
    const h = body.match(/^#\s+(.+)$/m);
    title = h ? h[1] : (dm ? dm[2].replace(/-/g, ' ') : filename.replace(/\.md$/, ''));
  }
  return { title, date };
}

function excerptOf(body) {
  const plain = body.replace(/^#.*$/m, '').replace(/[#*`$_>\[\]!]/g, '').trim();
  return plain.slice(0, 160).replace(/\s+\S*$/, '') + (plain.length > 160 ? '…' : '');
}

async function loadPosts() {
  const listEl = document.getElementById('list');
  const sidebarEl = document.getElementById('sidebarList');
  const owner = (cfg.owner || '').trim();
  const repo = (cfg.repo || '').trim();
  const branch = (cfg.branch || '').trim();
  const postsPath = (cfg.postsPath || '').trim();
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${postsPath}?ref=${branch}`;
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`GitHub API trả về lỗi ${res.status} khi gọi:<br><a href="${apiUrl}" target="_blank" rel="noopener">${apiUrl}</a><br>Mở link trên ở tab mới — nếu nó vẫn báo lỗi thì owner/repo/branch/postsPath trong config.js đang sai; nếu nó ra JSON bình thường thì trang đang dính cache, hãy hard refresh (Ctrl+Shift+R).`);
    const files = (await res.json()).filter(f => f.name.endsWith('.md'));
    if (files.length === 0) {
      listEl.textContent = `Chưa có bài viết nào trong thư mục "${cfg.postsPath}/". Push một file .md vào đó để xuất hiện ở đây.`;
      sidebarEl.textContent = 'Chưa có bài viết.';
      return;
    }
    files.sort((a, b) => b.name.localeCompare(a.name)); // mới nhất trước, nhờ prefix ngày YYYY-MM-DD

    const items = await Promise.all(files.map(async f => {
      const raw = norm(await (await fetch(f.download_url)).text());
      const { meta, body } = parseFrontmatter(raw);
      const { title, date } = guessTitleAndDate(f.name, meta, body);
      return { title, date, excerpt: meta.excerpt || excerptOf(body), path: f.path };
    }));

    listEl.className = '';
    listEl.innerHTML = items.map(p => `
      <div class="post-item">
        <div class="date">${p.date}</div>
        <h2><a href="post.html?file=${encodeURIComponent(p.path)}">${p.title}</a></h2>
        <p>${p.excerpt}</p>
      </div>
    `).join('');

    sidebarEl.className = '';
    sidebarEl.innerHTML = `<ul>${items.map(p => `
      <li>
        <a href="post.html?file=${encodeURIComponent(p.path)}">${p.title}<span class="date">${p.date}</span></a>
      </li>
    `).join('')}</ul>`;
  } catch (e) {
    listEl.innerHTML = 'Lỗi tải danh sách bài viết: ' + e.message;
    sidebarEl.textContent = 'Lỗi tải mục lục.';
  }
}
loadPosts();
</script>
</body>
</html>
